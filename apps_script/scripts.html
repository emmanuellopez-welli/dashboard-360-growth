/* Historia de dos bugs en este mismo punto, ya superados los dos:
   1. Antes mostraba SIEMPRE la ultima fila (hoy), sin importar el rango
      elegido — poner "agosto" no cambiaba nada.
   2. Despues caia "a la mas cercana" cuando el rango no tenia fila propia,
      pero sin piso: al pedir julio-2026 (anterior al arranque del software)
      se caia a la ULTIMA fila, que es septiembre — pedias julio y veias la
      plata de septiembre. De ahi salia el "63 millones" que no cuadraba.
   3. Corregido eso, seguia aproximando al MES CALENDARIO que tocara el fin
      del rango en vez de usar el rango exacto (24-sep-2026: filtrando
      24-ago a 24-sep, la tarjeta mostraba solo septiembre) — pedido
      explicito de Emmanuel: "debería mostrarme TODO de ese período". Ya no
      hay aproximacion: `metaRango`/`metaRangoSemanal` (y sus pares de
      rescate total) se calculan en el servidor sobre R.inicio..R.fin
      literal, y el toggle esta-semana/este-mes solo cambia la VARA de
      comparacion (tasa calibrada semanal vs mensual), no que dias se ven. */

function f4MetaRender() {
  var ge = (D.f4 || {}).gestion || {};
  var cont = document.getElementById('metaCuerpo');
  if (!cont) return;
  var esMes = F4_META.gran === 'mes';
  var esGeneral = F4_META.poblacion === 'rescateTotal';

  if (esGeneral) {
    f4MetaRenderRescateTotal_(ge, cont, esMes);
    return;
  }

  // El rango es SIEMPRE el filtro global exacto (R.inicio..R.fin) — el
  // toggle esta-semana/este-mes solo decide con que tasa calibrada se
  // compara (metaRango usa la mensual, metaRangoSemanal la semanal), no
  // que dias se miran. Pedido explicito 24-sep-2026: filtrar 24-ago a
  // 24-sep tiene que mostrar esos 32 dias completos, no solo septiembre.
  var ult = esMes ? ge.metaRango : ge.metaRangoSemanal;
  if (!ult || (!ult.dias && ult.meta === null)) {
    cont.innerHTML = '<div class="vacio-graf">No hay meta para el rango ' +
      'elegido. La gestión con software arrancó el <b>31 de julio de 2026</b>; ' +
      'antes de esa fecha no hay historial con el que calibrar una meta. ' +
      'Lo que pasó antes está en la gráfica de abajo.</div>';
    return;
  }
  var fDesde = document.getElementById('fDesde').value;
  var fHasta = document.getElementById('fHasta').value;
  var etiqueta = 'del ' + etiquetaSemanaCorta(fDesde) + ' al ' + etiquetaSemanaCorta(fHasta) +
    ' · vara ' + (esMes ? 'mensual' : 'semanal');
  // diasHabiles = TRANSCURRIDOS, diasHabilesTotal = el periodo completo. La
  // meta se calibra aparte (tasaObjetivoMes/Semana, el mejor periodo YA
  // CERRADO) y se aplica sobre bolsaProyectada, que solo proyecta cuando el
  // periodo todavia esta en curso.
  var h = '<p class="sub" style="margin:0 0 10px">' + esc(etiqueta) + ' · ' +
    fNum(ult.dias) + ' de ' + fNum(ult.diasHabiles) + ' días hábiles ' +
    'trabajados (el rango completo tiene ' + fNum(ult.diasHabilesTotal) + ')</p>';
  var bolsaMeta = ult.bolsaProyectada || ult.bolsa;
  h += '<div class="metas-actual">' +
    filaMetaGrande_('Meta de cobertura', 'share de la bolsa que el equipo ' +
      'alcanzó a trabajar', fPct(ult.cobertura),
      fPct(ge.tasaObjetivoCobertura), ult.cumplimientoCobertura) +
    filaMetaGrande_('Meta de contactados', 'de lo trabajado, share que ' +
      'contesta la llamada', fPct(ult.contacto),
      fPct(ge.tasaObjetivoContacto), ult.cumplimientoContacto) +
    filaMetaGrande_('Meta de desembolso', 'sobre la bolsa ' +
      (ult.proyectado ? 'proyectada de todo el rango' : 'de este rango') +
      ' (' + fCopC(bolsaMeta) + ')',
      fCopC(ult.desembolsado), fCopC(ult.meta), ult.cumplimiento) +
    '</div>';
  // La cobertura puede pasar el 100% de verdad: el equipo tambien ataca
  // casos que quedaron sin trabajar de dias anteriores, asi que "trabajado"
  // puede ser mayor que "lo que entro" en ese mismo periodo. Sin esta linea
  // se lee como un error de cuentas.
  if (ult.cumplimientoCobertura !== null && ult.cumplimientoCobertura > 100) {
    h += '<p class="sub" style="margin:8px 0 0">La cobertura superó la ' +
      'meta porque el equipo también trabaja casos que quedaron sin tocar ' +
      'de días anteriores, no solo lo que entró en este período.</p>';
  }
  cont.innerHTML = h;
}

/* "Rescate total" (todas las palancas, no solo Kevin) es mas simple que la
   meta de Kevin: no tiene bolsa ni cobertura/contacto (se mide contra su
   propio historico, no contra una bolsa del dia), asi que es solo UNA
   tarjeta — desembolsado contra una meta fija en pesos (el mejor periodo
   YA CERRADO x 1.4 de estiron, sin proyeccion). Se separa de f4MetaRender
   para no forzar las dos poblaciones dentro de la misma forma de tarjeta.

   La poblacion es "creditos que tardaron MAS de 2 dias en firmar" — la
   definicion de "necesito que alguien lo empuje", venga esa ayuda de
   Kevin, de otra palanca futura, o de nadie (y aun asi tardo). Por eso
   Rescate total >= Kevin siempre: incluye lo que Kevin no alcanzo a
   tocar. Corregido el 9-sep-2026: la primera version media TODA la
   empresa, sin filtrar por esos 2 dias — eso mezclaba conversion organica
   con rescate y disparaba el numero a una escala que no tenia que ver con
   este frente (~42x Kevin, contra las ~3x que da bien definido). */
function f4MetaRenderRescateTotal_(ge, cont, esMes) {
  // Mismo cambio 24-sep-2026 que f4MetaRender: el rango es el filtro
  // global exacto, no el mes/semana calendario mas cercano. La meta sigue
  // siendo en PESOS fijos (el mejor periodo ya cerrado x 1.4), prorrateada
  // por los dias habiles reales del rango elegido — el toggle esta-semana/
  // este-mes decide si se prorratea desde la meta semanal o la mensual.
  var ult = esMes ? ge.metaRangoRescateTotalMensual : ge.metaRangoRescateTotalSemanal;
  if (!ult || ult.meta === null) {
    cont.innerHTML = '<div class="vacio-graf">No hay meta de rescate total ' +
      'para el rango elegido — todavía no hay ' + (esMes ? 'un mes' : 'una semana') +
      ' ya cerrada con la que calibrar.</div>';
    return;
  }
  var fDesde = document.getElementById('fDesde').value;
  var fHasta = document.getElementById('fHasta').value;
  var etiqueta = 'del ' + etiquetaSemanaCorta(fDesde) + ' al ' + etiquetaSemanaCorta(fHasta) +
    ' · vara ' + (esMes ? 'mensual' : 'semanal');
  var h = '<p class="sub" style="margin:0 0 10px">' + esc(etiqueta) + ' · ' +
    fNum(ult.casos) + ' créditos que tardaron más de 2 días en firmar</p>';
  h += '<div class="metas-actual">' +
    filaMetaGrande_('Meta de desembolso · rescate total (todas las palancas)',
      (esMes ? 'el mejor mes ya cerrado' : 'la mejor semana ya cerrada') + ', con 40% de ' +
      'estirón, prorrateada a los días hábiles de este rango · créditos ' +
      'aprobados que tardaron más de 2 días en firmar, los haya trabajado ' +
      'Kevin o no',
      fCopC(ult.desembolsado), fCopC(ult.meta), ult.cumplimiento) +
    '</div>';
  cont.innerHTML = h;
}

// Estado del selector local de la linea de tiempo: vive fuera de D porque

/* Una sola pieza, barras + linea, MISMO eje X (los mismos meses, oct-2024
   a hoy): las barras son la plata desembolsada (reconstruida para
   'antes' cruzando gestion_historica.documento contra t_sol_v2, ver
   pull_hist_plata.py) y la linea es la tasa de firma — la unica metrica
   que existe igual en las dos operaciones. Plata y % no comparten
   escala, asi que cada una tiene SU eje, rotulado en el color de su
   serie. Con la meta (mejor mes ya cerrado x 1.4) y el quiebre de
   operacion marcados encima. */
function f4HistoriaRenderKevin_(ge, cont, ley, nar) {
  var serie = ge.historiaUnida || [];
  if (!serie.length) {
    cont.innerHTML = '<div class="vacio-graf">Todavía no hay historial ' +
      'de Kevin para graficar.</div>';
    if (ley) ley.innerHTML = ''; if (nar) nar.innerHTML = '';
    return;
  }
  if (ley) {
    ley.innerHTML = '<span class="leyenda-item"><i style="background:var(--s2)"></i>' +
      'Desembolsado</span><span class="leyenda-item"><i style="background:var(--s1)"></i>' +
      '% que firmó</span>';
  }
  var corte = serie.filter(function (m) { return m.ahora; })[0];
  var ultimo = serie[serie.length - 1];
  chBarrasLinea2Ejes(cont, serie.map(function (m) {
    return { x: m.mes, barra: m.desembolsado, linea: m.tasaFirma };
  }), {
    colorBarra: 'var(--s2)', colorLinea: 'var(--s1)',
    nombreBarra: 'Desembolsado', nombreLinea: '% que firmó',
    formatoEjeBarra: fCompacto, formatoEjeLinea: fPct,
    formatoBarra: fCopC, alto: 260, gran: 'mes',
    // SIN metaLinea a propósito (quitada 9-sep-2026): es un valor de %
    // (tasaObjetivoFirma) dibujado con la escala del eje derecho, pero al
    // ser una línea horizontal se lee visualmente contra las barras de
    // plata del eje izquierdo — el clásico problema de un gráfico de dos
    // ejes. Se veía como si la meta fuera ~930M cuando el mejor mes de
    // plata apenas llega a ~580M. La meta sigue explicada en texto en la
    // narrativa de abajo, donde un número no se puede leer contra el eje
    // equivocado.
    corte: corte ? corte.mes : null,
    corteEtq: 'arranca el software (31-jul-2026)'
  });
  if (nar) nar.innerHTML = narrativaHistoriaFirma_(serie, ge.tasaObjetivoFirma, ultimo);
}

/* Rescate total no tiene "% que firmó" (no se mide contra una lista de
   trabajo, sino contra su propio historico de desembolsos), asi que es un
   solo eje: barras de desembolso + la meta fija en pesos como linea
   punteada — el mismo componente que ya usa el resto del tablero para
   barras con meta, sin inventar uno nuevo. Sigue el toggle semana/mes de
   la tarjeta de arriba, para que "por que esa meta" se responda con el
   mismo grano que se esta mirando. */
function f4HistoriaRenderRescateTotal_(ge, cont, ley, nar) {
  var esMes = F4_META.gran === 'mes';
  var serie = esMes ? (ge.metasMesRescateTotal || []) : (ge.metasRescateTotal || []);
  if (!serie.length) {
    cont.innerHTML = '<div class="vacio-graf">Todavía no hay historial ' +
      'de rescate total para graficar.</div>';
    if (ley) ley.innerHTML = ''; if (nar) nar.innerHTML = '';
    return;
  }
  if (ley) {
    ley.innerHTML = '<span class="leyenda-item"><i style="background:var(--s2)"></i>' +
      'Desembolsado · rescate total (todas las palancas)</span>';
  }
  // SIN meta a propósito (quitada 9-sep-2026, a pedido de Emmanuel): la
  // línea punteada de meta en la gráfica de Kevin confundió en una
  // presentación (se leía contra la escala equivocada), y por consistencia
  // se quitó también acá, aunque esta sí comparte una sola escala con las
  // barras. La meta sigue explicada en texto en la narrativa de abajo.
  chBarrasMeta(cont, serie.map(function (m) {

/* La lectura se arma sola: compara el promedio de "antes" contra "ahora"
   y dice donde esta parado el ultimo mes frente a la meta — para que la
   grafica se pueda leer sin que nadie tenga que explicarla en la reunion. */
function narrativaHistoriaFirma_(serie, meta, ultimo) {
  var antes = serie.filter(function (m) { return !m.ahora && m.tasaFirma !== null; });
  var ahora = serie.filter(function (m) { return m.ahora && m.tasaFirma !== null; });
  function prom(arr) {
    return arr.length ? arr.reduce(function (a, m) { return a + m.tasaFirma; }, 0) / arr.length : null;
  }
  var pAntes = prom(antes), pAhora = prom(ahora);
  var txt = 'De los casos que se gestionan, <b>' + fPct(ultimo.tasaFirma || 0) +
    '</b> firmó en ' + esc(etiquetaX(ultimo.mes, 'mes')) +
    (ultimo.enCurso ? ' (mes en curso, todavía sin cerrar)' : '') + '.';
  if (pAntes !== null && pAhora !== null) {
    var dir = pAhora > pAntes * 1.05 ? 'mejor que'
      : pAhora < pAntes * 0.95 ? 'por debajo de' : 'en línea con';
    txt += ' El promedio desde que arrancó el software (' + fPct(Math.round(pAhora * 10) / 10) +
      ') va <b>' + dir + '</b> el promedio de la operación anterior (' +
      fPct(Math.round(pAntes * 10) / 10) + ').';
  }
  if (meta !== null && meta !== undefined) {
    txt += ' La meta (' + fPct(meta) + ') es el <b>mejor mes que el rescate ya demostró, ' +
      'con un 40% de estirón encima</b> — no un número puesto a dedo, y va a subir en ' +
      'cuanto un mes nuevo supere al que hoy es el mejor.';
  }
  return txt;
}

/* El embudo de la gestion, en casos y en plata, desde la bolsa completa.

   Reemplaza dos paneles: la cobertura a la izquierda y el embudo a la
   derecha. Estaban separados y el lector tenia que cruzarlos a mano para
   entender que el cierre no era sobre toda la oportunidad sino sobre el
   pedazo que alcanzamos a tocar. Con la bolsa como primer paso eso se lee
   de corrido y sin hacer cuentas.

   Los porcentajes son SIEMPRE sobre la bolsa, no sobre el paso anterior:
   encadenar porcentajes esconde el tamano real de cada fuga.

   Tres tipos de paso, y la diferencia importa:
     hito     la bolsa, la lista y la firma — los tres numeros que se citan
     fuga     el paso no avanza el embudo, es la salida
     cruzado  sale del cruce contra el credito y no del registro de la
              llamada, asi que NO es un subconjunto del paso de arriba: la
              plata firmada ($310 M) es mayor que la de los interesados
              ($270 M) porque hay firmas registradas como "No contesta" */
function embudoPlata(pasos, opt) {
  opt = opt || {};
  if (!(pasos || []).length) {
    return '<div class="vacio-graf">Sin gestión en el período</div>';
  }
  var base = pasos[0] || {};
  var maxC = base.casos || 0, maxM = base.monto || 0;
  pasos.forEach(function (p) {
    if (p.casos > maxC) maxC = p.casos;
    if (p.monto > maxM) maxM = p.monto;
  });
  var h = '<div class="emb2">' +
    '<div class="emb2-cab">' +
    '<div></div><div>Casos</div><div>Plata</div>' +
    '</div>';
  pasos.forEach(function (p, i) {
    var cls = 'emb2-fila' + (p.fuga ? ' es-fuga' : '') +
      (p.hito ? ' es-hito' : '') + (p.cruzado ? ' es-cruzado' : '');
    var wC = maxC ? Math.max(0.6, (p.casos / maxC) * 100) : 0;
    var wM = (maxM && p.monto !== null) ? Math.max(0.6, (p.monto / maxM) * 100) : 0;
    h += '<div class="' + cls + '">' +
      '<div class="emb2-etq"><b>' + esc(p.paso) + '</b>' +
      (p.sub ? '<span>' + esc(p.sub) + '</span>' : '') + '</div>' +
      '<div class="emb2-mitad">' +
      '<div class="emb2-pista"><div class="emb2-barra c" style="width:' +
      wC + '%"></div></div>' +
      '<div class="emb2-num"><b>' + fNum(p.casos) + '</b>' +
      '<span>' + fPct(p.pct) + '</span></div>' +
      '</div>' +
      '<div class="emb2-mitad">' +
      '<div class="emb2-pista"><div class="emb2-barra m" style="width:' +
      wM + '%"></div></div>' +
      '<div class="emb2-num"><b>' +
      (p.monto === null ? '--' : fCopC(p.monto)) + '</b>' +
      '<span>' + (p.pctMonto === null ? '--' : fPct(p.pctMonto)) +
      '</span></div>' +
      '</div>' +
      '</div>';
    // El salto de la bolsa a la lista es la cobertura: se rotula en el
    // hueco entre las dos filas en vez de en un panel aparte.
    if (i === 0 && pasos[1]) {
      h += '<div class="emb2-salto">de esa bolsa, la lista alcanzó a tocar ' +
        '<b>' + fPct(pasos[1].pct) + ' de los casos</b> y <b>' +
        (pasos[1].pctMonto === null ? '--' : fPct(pasos[1].pctMonto)) +
        ' de la plata</b>' + (opt.nota ? ' · ' + opt.nota : '') + '</div>';
    }
  });
  h += '</div>';
  return h;
}

/* Calendario de la gestion, lunes a viernes. En 19 dias de operacion no hay
   un solo sabado ni domingo, asi que las dos columnas del fin de semana
   solo servirian para dejar huecos.

   El tinte de la celda codifica la cobertura EN PLATA sobre lo que entro
   ese dia — un solo tono, claro a oscuro, que es lo que corresponde a una
   magnitud. La cobertura pasa del 100% cuando la lista trabaja sobrantes
   de dias anteriores, y esas celdas se marcan aparte en vez de recortarse
   a 100: recortar borraria justo el dia en que se atacaron los pendientes. */
function calendarioGestion(sem, stock, ge) {
  ge = ge || {};
  if (!(sem || []).length) {
    return '<div class="vacio-graf">Sin gestión en el período</div>';
  }
  function nivel(c) {
    if (c === null || c === undefined) return 0;
    if (c >= 100) return 5;
    if (c >= 60) return 4;
    if (c >= 35) return 3;
    if (c >= 15) return 2;
    return 1;
  }
  var h = '<div class="cal">' +
    '<div class="cal-fila cal-cab"><div class="cal-sem"></div>' +
    ['lun', 'mar', 'mié', 'jue', 'vie'].map(function (d) {
      return '<div class="cal-dow">' + d + '</div>';
    }).join('') + '</div>';

  sem.forEach(function (w) {
    h += '<div class="cal-fila"><div class="cal-sem">' +
      esc(etiquetaSemanaCorta(w.semana)) + '</div>';
    w.dias.forEach(function (d) {
      if (d.fueraRango) {
        h += '<div class="cal-cel cal-fuera-rango"><span class="cal-dia">' +
          d.dia + '</span></div>';
        return;
      }
      if (!d.hubo) {
        h += '<div class="cal-cel vacia"><span class="cal-dia">' + d.dia +
          '</span><span class="cal-nada">' +
          (d.sinCredito ? 'sin datos' : 'sin gestión') + '</span></div>';
        return;
      }
      // Todo el detalle del dia va en el title: la celda muestra lo que se
      // compara de un barrido y el resto queda a un hover de distancia.
      var t = d.fecha + '\n' +
        'Entró a la bolsa: ' + fNum(d.entroCasos) + ' casos · ' +
          fCopC(d.entroMonto) + '\n' +
        'Trabajado: ' + fNum(d.casos) + ' casos · ' +
          (d.sinMonto ? 'monto no registrado' : fCopC(d.monto)) + '\n' +
        'Contestó: ' + fNum(d.contesto) + ' · habló: ' + fNum(d.hablo) + '\n' +
        'Firmó: ' + fNum(d.firmo) + ' · ' + fCopC(d.mFirmo) + '\n' +
        'Cobertura en plata: ' +
          (d.cobertura === null ? 'no calculable' : fPct(d.cobertura)) +
        ' · en casos: ' +
          (d.coberturaCasos === null ? '--' : fPct(d.coberturaCasos));
      // El pie de la celda antes era "32 · 12 · 3": tres numeros pelados
      // que no dicen a que corresponden. Ahora es una frase corta con la
      // plata rescatada del dia como cierre, que es la pregunta que el
      // dia responde y antes solo vivia en el tooltip.
      h += '<div class="cal-cel n' + nivel(d.cobertura) +
        (d.cobertura !== null && d.cobertura >= 100 ? ' desborde' : '') +
        '" title="' + esc(t) + '">' +
        '<span class="cal-dia">' + d.dia + '</span>' +
        '<span class="cal-cob">' +
        (d.cobertura === null ? '--' : fPct(d.cobertura)) + '</span>' +
        '<span class="cal-hay">' +
        (d.sinCredito ? 'crédito sin refrescar' : fCopC(d.entroMonto) + ' entró') +
        '</span>' +
        '<span class="cal-toc">' +
        (d.sinMonto ? 'sin monto' : fCopC(d.monto)) + ' tocado</span>' +
        '<span class="cal-pie">' + fNum(d.casos) + ' casos' +
        (d.contesto ? ' · ' + fNum(d.contesto) + ' contestó' : '') +
        '</span>' +
        '<span class="cal-rescatado' + (d.firmo ? '' : ' cero') + '">' +
        (d.firmo
          ? fCopC(d.mFirmo) + ' rescatado <b>(' + fNum(d.firmo) + ')</b>'
          : 'nada rescatado') +
        '</span>' +
        '</div>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="cal-leyenda">' +
    '<div class="cal-esc"><span>cobertura en plata</span>' +
    [1, 2, 3, 4, 5].map(function (n) {
      return '<i class="n' + n + '"></i>';
    }).join('') + '<span>0% → 100%+</span></div>' +
    '<div class="cal-clave">cada celda: <b>plata que entró</b> · <b>plata ' +
    'tocada</b> · casos y contactos · y <b>plata rescatada</b> ese día</div>' +
    '</div>';

  return h;
}

/* Embudo de casos para WhatsApp: enviado -> entregado -> leido -> respondido.
   Reutiliza el mismo lenguaje visual compacto (.embw) que el embudo de
   Welli Points — no hay plata que mostrar aca, es puro conteo de mensajes. */
function embudoWa_(pasos) {
  var max = (pasos[0] && pasos[0].n) || 1;
  return '<div class="embw">' + pasos.map(function (p) {
    var w = Math.max(1, (p.n / max) * 100);
    return '<div class="embw-fila' + (p.hito ? ' ultimo' : '') + '">' +
      '<div class="embw-etq">' + esc(p.paso) + '</div>' +
      '<div class="embw-pista"><div class="embw-barra" style="width:' + w +
      '%"></div></div>' +
      '<div class="embw-num"><b>' + fNum(p.n) + '</b>' +
      '<span>' + fPct(p.pct) + '</span></div></div>';
  }).join('') + '</div>';
}

/* Etiqueta corta de semana para el calendario: "25 ago" en vez del ISO
   completo, que en una columna angosta obliga a partir la linea. */
function etiquetaSemanaCorta(iso) {
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
             'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var m = Number(iso.substring(5, 7)) - 1;
  return Number(iso.substring(8, 10)) + ' ' + (MES[m] || '');
}

/* Los limites del dato, al lado de los numeros y no en un pie de pagina.
   Van aca porque cada uno cambia como se lee una cifra de arriba. */
function limitesDato(lista, titulo) {
  if (!(lista || []).length) return '';
  var h = '<div class="limites"><div class="limites-tit">' +
    esc(titulo || 'Qué NO dicen estos números') + '</div><ul>';
  lista.forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
  return h + '</ul></div>';
}

/* Celda de cambio: signo, color y unidad. Vive aparte porque la usan la
   tabla de accion y la semanal, y antes estaba embebida en la primera. */
function deltaCel(d, invertido, puntos) {
  if (d === null || d === undefined) return '<span class="delta-cel">--</span>';
  var bueno = invertido ? (d < 0) : (d > 0);
  var cls = d === 0 ? 'plano' : (bueno ? 'sube' : 'baja');
  var txt = (d === 0 ? '=' : (d > 0 ? '▲ +' : '▼ ')) + fNum(d) +
    (puntos ? ' pp' : '%');
  return '<span class="delta-cel ' + cls + '">' + txt + '</span>';
}

/* Welli Points con datos reales de welli-growth.wp_data. El frente ya no
   pregunta "cuantas sedes entraron" (eso era adopcion de un programa) sino

    h += panel('Sedes que entran, y lo que desembolsan ese mismo día',

    pintar('gF5Tendencia', function (el) {

        return { x: x.x, barra: x.monto, linea: x.sedes };
      }), {
        colorBarra: 'var(--s2)', colorLinea: 'var(--s1)',

    h += panel('Adopción por segmento', 'de las sedes que alguna vez entraron, por mundo comercial',
      '', 'gF5Mundo');
    pintar('gF5Mundo', function (el) {

        { color: 'var(--s3)', formato: fNum });

    if ((ad.top || []).length) {
      h += panel('Top 5 sedes más activas', 'por número de visitas registradas', tabla([
        { k: 'sede', t: 'Sede', f: 'txt', txt: true },
        { k: 'email', t: 'Correo', f: 'txt' },
        { k: 'visitas', t: 'Visitas' }
      ], ad.top.slice(0, 5)));
      h += '<p class="sub" style="margin-top:10px">' +
        fNum(ad.nuncaLogin || 0) + ' sedes habilitadas nunca han iniciado sesión.</p>';

  // =================================================================== 2
  h += '<h2 class="sec">2 · Las sedes que entran a la plataforma, ¿desembolsan más?</h2>' +

function vistaF6() {

/* =====================================================================
   Filtro global de origen de sede
   Aplica a Profundizacion, Rescate y Welli Points. Adquisicion no se
   filtra: por definicion mide lo que trae marketing.
   La lista de origenes NO esta escrita a mano: sale del catalogo que
   devuelve el servidor, asi que si HubSpot gana un origen nuevo aparece
   solo en el selector.
   ===================================================================== */
var ORIGENES_SEL = [];      // vacio = todos
/* Lo elegido en cada uno de los tres roles: { hunter, farmer, cs }. Vacio en
   un rol = ese rol no filtra. Los tres se combinan con Y. */
var ROLES_SEL = {};
var CATALOGO_ORIG = [];
var PRESETS_ORIG = {};
var ETIQ_PRESET = {};

var ORDEN_GRUPO = ['marketing', 'comercial', 'alianzas', 'otros', 'sin_origen'];
var NOMBRE_GRUPO = {
  marketing: 'Marketing', comercial: 'Equipo comercial',
  alianzas: 'Alianzas y marcas', otros: 'Otros', sin_origen: 'Sin origen'
};

function mismosOrigenes(a, b) {
  if (a.length !== b.length) return false;
  for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) < 0) return false;
  return true;
}

function etiquetaOrigen() {
  if (!ORIGENES_SEL.length) return 'Todos los orígenes';
  var claves = Object.keys(PRESETS_ORIG);
  for (var i = 0; i < claves.length; i++) {
    var k = claves[i];
    if (k === 'todos') continue;
    if (mismosOrigenes(PRESETS_ORIG[k] || [], ORIGENES_SEL)) {
      return ETIQ_PRESET[k] || k;
    }
  }
  if (ORIGENES_SEL.length === 1) return ORIGENES_SEL[0];
  return ORIGENES_SEL.length + ' orígenes';
}


/** Pinta el panel. Se llama cada vez que llegan datos nuevos. */
function pintarPanelOrigen() {
  var pres = document.getElementById('poPresets');
  var lista = document.getElementById('poLista');
  if (!pres || !lista) return;

  pres.innerHTML = Object.keys(PRESETS_ORIG).map(function (k) {
    var sel = (k === 'todos')
      ? ORIGENES_SEL.length === 0
      : mismosOrigenes(PRESETS_ORIG[k] || [], ORIGENES_SEL);
    return '<button class="po-preset" type="button" data-preset="' + esc(k) + '"' +
      ' aria-pressed="' + (sel ? 'true' : 'false') + '">' +
      esc(ETIQ_PRESET[k] || k) + '</button>';
  }).join('');

  var porGrupo = {};
  CATALOGO_ORIG.forEach(function (o) {
    var g = o.grupo || 'otros';
    if (!porGrupo[g]) porGrupo[g] = [];
    porGrupo[g].push(o);
  });
  var h = '';
  ORDEN_GRUPO.forEach(function (g) {
    var arr = porGrupo[g];
    if (!arr || !arr.length) return;
    h += '<div class="po-grupo">' + esc(NOMBRE_GRUPO[g] || g) + '</div>';
    arr.forEach(function (o) {
      var marcado = ORIGENES_SEL.indexOf(o.origen) >= 0;
      h += '<label class="po-item"><input type="checkbox" value="' + esc(o.origen) + '"' +
        (marcado ? ' checked' : '') + '>' +
        '<span>' + esc(o.origen) + '</span>' +
        '<span class="po-n">' + fNum(o.sedes) + '</span></label>';
    });
  });
  lista.innerHTML = h;

  var txt = document.getElementById('btnOrigenTxt');
  if (txt) txt.textContent = etiquetaOrigen();
}

function leerChecksOrigen() {
  var ins = document.querySelectorAll('#poLista input[type=checkbox]');
  var out = [];
  for (var i = 0; i < ins.length; i++) if (ins[i].checked) out.push(ins[i].value);
  // Si estan todos marcados es lo mismo que "todos": se guarda vacio para
  // que el servidor no compare 24 cadenas en cada fila.
  if (out.length === CATALOGO_ORIG.length) return [];
  return out;
}

function abrirPanelOrigen(abrir) {
  var p = document.getElementById('panelOrigen');
  var b = document.getElementById('btnOrigen');
  if (!p || !b) return;
  var visible = !p.classList.contains('oculto');
  var q = (abrir === undefined) ? !visible : abrir;
  p.classList.toggle('oculto', !q);
  b.setAttribute('aria-expanded', q ? 'true' : 'false');
}

function montarFiltroOrigen() {
  var btn = document.getElementById('btnOrigen');
  var panel = document.getElementById('panelOrigen');
  if (!btn || !panel) return;

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    abrirPanelOrigen();
  });
  panel.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { abrirPanelOrigen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') abrirPanelOrigen(false);
  });

  document.getElementById('poPresets').addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== panel && !t.getAttribute('data-preset')) t = t.parentNode;
    if (!t || t === panel) return;
    var k = t.getAttribute('data-preset');
    ORIGENES_SEL = (k === 'todos') ? [] : (PRESETS_ORIG[k] || []).slice();
    pintarPanelOrigen();
  });
  document.getElementById('poLista').addEventListener('change', function () {
    ORIGENES_SEL = leerChecksOrigen();
    var txt = document.getElementById('btnOrigenTxt');
    if (txt) txt.textContent = etiquetaOrigen();
  });
  document.getElementById('poNada').addEventListener('click', function () {
    ORIGENES_SEL = [];
    pintarPanelOrigen();
  });
  document.getElementById('poListo').addEventListener('click', function () {
    ORIGENES_SEL = leerChecksOrigen();
    abrirPanelOrigen(false);
    cargar();
  });
}

/** Cinta que recuerda el universo activo. Solo en los frentes filtrables. */
function cintaOrigen() {
  var m = (D && D.meta) || {};
  var partes = [];
  partes.push(m.origenTodos ? 'Todos los orígenes' : esc(m.origenEtiqueta || ''));
  // El equipo va SIEMPRE que no sea "todos": sin decirlo, un conteo de sedes
  // recortado por equipo se lee como el total del origen.
  if (!m.rolesTodos) partes.push(esc(m.rolEtiqueta || ''));
  var col = '<b>' + fNum(m.origenSedes || 0) + '</b> sedes';
  if (!m.origenTodos || !m.rolesTodos) {
    col = '<b>' + fNum(m.origenSedes || 0) + '</b> de ' +
      fNum(m.origenSedesBase || 0) + ' sedes';
  }
  // Desde el 9-sep-2026 las deshabilitadas YA NO se excluyen (acordado con
  // BI: su tablero tampoco las resta). Se declara igual — cuántas de las
  // sedes de arriba están deshabilitadas — para que la baja siga siendo
  // visible sin volver a restarla del conteo.
  if (m.deshabilitadas) {
    col += ' <span class="cinta-nota">· incluye ' + fNum(m.deshabilitadas) +
      ' deshabilitadas</span>';
  }
  // Reatribuciones de origen: se declaran SIEMPRE que muevan algo. Un
  // ajuste de atribución que no se dice es lo que revienta en un comité
  // cuando alguien abre HubSpot al lado y no le cuadra.
  var rt = m.reatribucion || {};
  if (rt.sedes && (rt.reglas || []).length) {
    var titulo = rt.reglas.map(function (R) { return R.nota; }).join(' · ');
    col += ' <span class="cinta-nota" title="' + esc(titulo) + '">· ' +
      fNum(rt.sedes) + ' sede' + (rt.sedes === 1 ? '' : 's') + ' reatribuida' +
      (rt.sedes === 1 ? '' : 's') + ': ' +
      rt.reglas.map(function (R) {
        return esc(R.de) + ' → ' + esc(R.a) + ' (' + esc(R.desde) + ' a ' + esc(R.hasta) + ')';
      }).join(', ') + '</span>';
  }
  return '<div class="cinta-origen">' + partes.join(' · ') + ' · ' + col + '</div>';
}

/* Impactos apagados. Arrancan todos encendidos; se apagan para aislar una
   comunicacion. Vive fuera de la vista para sobrevivir a un repintado. */
var IMP_OFF = {};

/* Repinta SOLO la grafica y los chips, no la vista entera.
   Con render() completo el navegador rehace el DOM desde arriba y la pagina
   salta al inicio: hacer clic en un chip te sacaba de donde estabas. */
function refrescarImpactos() {
  var f = D.f7;
  if (!f) return;
  var cont = document.getElementById('gF7Serie');
  if (cont) chSerieImpactos(cont, f.serie || [], f.impactos || [],
    { vacio: 'Sin solicitudes de la cola larga en el período' });
  var chips = document.getElementById('f7Chips');
  if (chips) chips.innerHTML = chipsImpactos(f);
}
function toggleImpacto(id) {
  if (IMP_OFF[id]) delete IMP_OFF[id]; else IMP_OFF[id] = true;
  refrescarImpactos();
}
function impactosTodos(on) {
  IMP_OFF = {};
  if (!on) (D.f7.impactos || []).forEach(function (i) { IMP_OFF[i.id] = true; });
  refrescarImpactos();
}
function impactosSoloWf(aud) {
  IMP_OFF = {};
  (D.f7.impactos || []).forEach(function (i) {
    if (i.audiencia !== aud) IMP_OFF[i.id] = true;
  });
  refrescarImpactos();
}

/* El color dice el WORKFLOW, no el canal: es la pregunta del frente. El canal
   pasa a codificacion secundaria — linea continua WhatsApp, punteada email —
   que ademas es lo que hace legal el par verde/rosa en vision deutan. */
var F7_COLOR = {
  ESTRENA: 'var(--w1)', PERFILAMIENTO: 'var(--w2)', DESEMBOLSO: 'var(--w3)',
  REACTIVAR: 'var(--w4)', RECONOCIMIENTO: 'var(--w5)'
};
function colorWf(aud) { return F7_COLOR[aud] || 'var(--texto-3)'; }

function chipsImpactos(f) {
  var imp = f.impactos || [];
  if (!imp.length) return '';
  // Los chips se agrupan por workflow para que el color tenga con que
  // contrastar y para poder aislar un workflow de un clic.
  var porAud = {}, orden = [];
  imp.forEach(function (im) {
    if (!porAud[im.audiencia]) { porAud[im.audiencia] = []; orden.push(im.audiencia); }
    porAud[im.audiencia].push(im);
  });
  var h = '<div class="imp-barra">' +
    '<button class="imp-todo" onclick="impactosTodos(true)">todos</button>' +
    '<button class="imp-todo" onclick="impactosTodos(false)">ninguno</button></div>';
  orden.forEach(function (aud) {
    var lista = porAud[aud];
    var enc = lista.filter(function (im) { return !IMP_OFF[im.id]; }).length;
    h += '<div class="imp-grupo">' +
      '<button class="imp-wf" onclick="impactosSoloWf(\'' + aud + '\')" ' +
      'title="ver solo este workflow" style="--c:' + colorWf(aud) + '">' +
      '<i></i>' + esc(lista[0].nombre) +
      ' <small>' + enc + '/' + lista.length + '</small></button>';
    lista.forEach(function (im) {
      var on = !IMP_OFF[im.id];
      h += '<button class="imp-chip' + (on ? ' on' : '') + '" ' +
        'style="--c:' + colorWf(im.audiencia) + '" ' +
        'onclick="toggleImpacto(\'' + im.id + '\')" ' +
        'title="' + esc(im.nombre + ' · ' + im.pieza + ' · ' + im.canal + ' a ' +
          fNum(im.sedes) + ' sedes' + (im.tramo > 1
            ? ', repartidas en ' + im.tramo + ' días según fueron entrando al workflow: ' +
              (im.dias || []).map(function (x) {
                return etiquetaX(x.fecha, 'dia') + ' ' + fNum(x.sedes);
              }).join(', ')
            : '')) + '">' +
        '<i class="' + (im.canal === 'WhatsApp' ? 'wa' : 'mail') + '"></i>' +
        esc(etiquetaX(im.fecha, 'dia')) + ' · ' + esc(im.pieza) +
        ' <small>' + fNum(im.sedes) +
        (im.tramo > 1 ? ' · ' + im.tramo + 'd' : '') + '</small></button>';
    });
    h += '</div>';
  });
  return h;
}

/* Barras de solicitudes por dia con lineas verticales en los dias de impacto.
   No es un eje doble: los impactos no tienen escala propia, son marcas de
   evento sobre el eje de tiempo — la unica forma honesta de superponer un
   evento a una serie.

/* Barras de solicitudes por dia con lineas verticales en los dias de impacto.
   No es un eje doble: los impactos no tienen escala propia, son marcas de
   evento sobre el eje de tiempo — la unica forma honesta de superponer un
   evento a una serie.

   El COLOR dice el workflow y el trazo dice el canal (continuo WhatsApp,
   punteado email). Cada marca lleva su etiqueta escrita: una marca que no
   dice que es obliga a pasar el mouse para entender la grafica.

   Los rotulos se reparten en CARRILES. Apilar por dia no basta: si dos
   impactos caen en dias vecinos de un rango largo, sus etiquetas quedan a
   pocos pixeles y se pisan hasta ser ilegibles. Se recorren de izquierda a
   derecha y cada uno baja al primer carril libre, que es la colocacion
   estandar para etiquetas de evento. */
function chSerieImpactos(cont, serie, impactos, opt) {
  opt = opt || {};
  if (!serie || !serie.length) {
    cont.innerHTML = '<div class="vacio-graf">' + esc(opt.vacio || 'Sin datos') + '</div>';
    return;
  }
  // Desembolso ($) EN LA MISMA grafica, como linea de eje derecho -- pedido
  // explicito 14-sep-2026 (se probo primero como panel aparte y no sirvio:
  // "quiero que todo este en un mismo grafico"). Es un eje doble de verdad
  // (dos escalas distintas), pero NO es el error de la seccion 5 de
  // CLAUDE.md: aquella vez era una linea de META estatica (un solo valor
  // horizontal) que se leia contra cualquiera de los dos ejes por error.
  // Aca son dos SERIES reales que varian dia a dia, cada una con su propio
  // eje rotulado en su color y su propia leyenda -- no hay un numero
  // ambiguo que confundir.
  var conMonto = opt.monto !== false && serie.some(function (p) { return p.monto; });
  // Geometria horizontal primero: los carriles necesitan x() para saber donde
  // cae cada marca, y la banda de etiquetas necesita los carriles para saber
  // cuanto alto reservar.
  var pl = 46, pr = conMonto ? 56 : 12, pb = 30;
  var an = W - pl - pr;
  var top = ejeMax(Math.max.apply(null, serie.map(function (p) { return p.y; }))) || 1;
  var topMonto = conMonto
    ? (ejeMax(Math.max.apply(null, serie.map(function (p) { return p.monto || 0; }))) || 1)
    : 1;
  var yM = function (v) { return pt + al - (v / topMonto) * al; };
  var bw = an / serie.length;
  var x = function (i) { return pl + i * bw; };

  var idx = {};
  serie.forEach(function (p, i) { idx[p.x] = i; });
  var porDia = {};
  (impactos || []).forEach(function (im) {
    if (IMP_OFF[im.id] || idx[im.fecha] === undefined) return;
    (porDia[im.fecha] = porDia[im.fecha] || []).push(im);
  });

  var marcas = [];
  Object.keys(porDia).sort().forEach(function (fch) {
    var n = porDia[fch].length;
    porDia[fch].forEach(function (im, k) {
      // Varios impactos del mismo dia caen en el mismo x y la ultima linea
      // tapa a las anteriores. Se separan un par de pixeles para que las tres
      // se vean; el dia sigue siendo el mismo.
      var off = n > 1 ? (k - (n - 1) / 2) * 2.5 : 0;
      marcas.push({ im: im, cx: x(idx[fch]) + bw / 2 + off });
    });
  });
  marcas.sort(function (a, b) { return a.cx - b.cx; });
  var finCarril = [];
  marcas.forEach(function (m) {
    m.etq = m.im.pieza + ' ' + fNum(m.im.sedes) +
      (m.im.tramo > 1 ? ' ·' + m.im.tramo + 'd' : '');
    m.ancho = m.etq.length * 5.3 + 14;
    m.izq = (m.cx + m.ancho) > (W - 12);
    var x0 = m.izq ? m.cx - m.ancho : m.cx;
    var c = 0;
    while (finCarril[c] !== undefined && finCarril[c] > x0 - 6) c++;
    m.carril = c;
    finCarril[c] = x0 + m.ancho;
  });
  var banda = marcas.length ? 12 + finCarril.length * 14 : 10;
  var H = (opt.alto || 250) + banda;
  var pt = banda, al = H - pt - pb;
  var y = function (v) { return pt + al - (v / top) * al; };

  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    esc(opt.aria || 'solicitudes por día con los impactos marcados') + '">';
  for (var g = 0; g <= 3; g++) {
    var vy = top * g / 3;
    s += '<line x1="' + pl + '" y1="' + y(vy).toFixed(1) + '" x2="' + (W - pr) +
      '" y2="' + y(vy).toFixed(1) + '" stroke="var(--borde)" stroke-width="1"/>';
    s += '<text x="' + (pl - 7) + '" y="' + (y(vy) + 3.5).toFixed(1) +
      '" text-anchor="end" font-size="9.5" fill="var(--texto-3)">' +
      esc(fNum(Math.round(vy))) + '</text>';
    if (conMonto) {
      s += '<text x="' + (W - pr + 7) + '" y="' + (yM(topMonto * g / 3) + 3.5).toFixed(1) +
        '" text-anchor="start" font-size="9.5" fill="var(--s2)">' +
        esc(fCopC(topMonto * g / 3)) + '</text>';
    }
  }
  if (conMonto) {
    s += '<text x="' + (pl - 7) + '" y="10" text-anchor="end" font-size="9.5" ' +
      'font-weight="700" fill="var(--texto-3)">Solicitudes</text>';
    s += '<text x="' + (W - pr + 7) + '" y="10" text-anchor="start" font-size="9.5" ' +
      'font-weight="700" fill="var(--s2)">Desembolso</text>';
  }

  // Marcas antes que las barras, para no taparlas.
  marcas.forEach(function (m) {
    var im = m.im, col = colorWf(im.audiencia);
    var dash = im.canal === 'WhatsApp' ? '' : ' stroke-dasharray="3 3"';
    var yl = 8 + m.carril * 14;
    s += '<line x1="' + m.cx.toFixed(1) + '" y1="' + yl + '" x2="' + m.cx.toFixed(1) +
      '" y2="' + (pt + al) + '" stroke="' + col + '" stroke-width="1.5"' +
      dash + ' opacity=".75"/>';
    s += '<circle cx="' + m.cx.toFixed(1) + '" cy="' + yl + '" r="3.2" fill="' +
      col + '"/>';
    s += '<text x="' + (m.izq ? m.cx - 6 : m.cx + 6).toFixed(1) + '" y="' + (yl + 3.4) +
      '" text-anchor="' + (m.izq ? 'end' : 'start') +
      '" font-size="9.5" font-weight="700" fill="' + col + '">' +
      esc(im.pieza) + '<tspan font-weight="400" fill="var(--texto-3)"> ' +
      esc(fNum(im.sedes) + (im.tramo > 1 ? ' ·' + im.tramo + 'd' : '')) +
      '</tspan></text>';
  });

  serie.forEach(function (p, i) {
    var bwd = Math.max(2, bw * 0.62);
    var bx = x(i) + (bw - bwd) / 2;
    if (p.y) {
      var yy = y(p.y), hh = pt + al - yy;
      var r = Math.min(3, bwd / 2, hh);
      s += '<path d="M' + bx + ' ' + (pt + al) + ' L' + bx + ' ' + (yy + r) +
        ' Q' + bx + ' ' + yy + ' ' + (bx + r) + ' ' + yy +
        ' L' + (bx + bwd - r) + ' ' + yy +
        ' Q' + (bx + bwd) + ' ' + yy + ' ' + (bx + bwd) + ' ' + (yy + r) +
        ' L' + (bx + bwd) + ' ' + (pt + al) + ' Z" fill="var(--s1)" opacity=".9"/>';
    }
    s += '<rect class="hit" data-i="' + i + '" x="' + x(i) + '" y="' + pt +
      '" width="' + bw + '" height="' + al + '" fill="transparent"/>';
  });

  if (conMonto) {
    var ptsMonto = '', trazando = false;
    serie.forEach(function (p, i) {
      var cx = x(i) + bw / 2, cy = yM(p.monto || 0);
      ptsMonto += (trazando ? ' L' : ' M') + cx.toFixed(1) + ' ' + cy.toFixed(1);
      trazando = true;
    });
    s += '<path d="' + ptsMonto + '" fill="none" stroke="var(--s2)" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>';
    serie.forEach(function (p, i) {
      if (!p.monto) return;
      s += '<circle cx="' + (x(i) + bw / 2).toFixed(1) + '" cy="' + yM(p.monto).toFixed(1) +
        '" r="2.6" fill="var(--s2)" stroke="var(--superficie)" stroke-width="1"/>';
    });
  }

  s += '<line x1="' + pl + '" y1="' + (pt + al) + '" x2="' + (W - pr) + '" y2="' +
    (pt + al) + '" stroke="var(--borde-fuerte)" stroke-width="1"/>';
  var cada = Math.max(1, Math.ceil(serie.length / 11));
  serie.forEach(function (p, i) {
    if (i % cada && i !== serie.length - 1) return;
    s += '<text x="' + (x(i) + bw / 2).toFixed(1) + '" y="' + (H - 10) +
      '" text-anchor="middle" font-size="9.5" fill="var(--texto-3)">' +
      esc(etiquetaX(p.x, 'dia')) + '</text>';
  });
  s += '</svg>';
  cont.innerHTML = s;

  var tt = montarTooltip(cont);
  var svg = cont.querySelector('svg');
  svg.querySelectorAll('.hit').forEach(function (hh) {
    hh.addEventListener('mouseenter', function () {
      var p = serie[Number(hh.getAttribute('data-i'))];
      var det = [{ nombre: 'Solicitudes', valor: fNum(p.sol) },
                 { nombre: 'Desembolsos', valor: fNum(p.des) },
                 { nombre: 'Plata desembolsada', valor: fCopC(p.monto || 0) },
                 { nombre: 'Sedes que aplicaron', valor: fNum(p.sedes) }];
      (porDia[p.x] || []).forEach(function (im) {
        var hoy = (im.dias || []).filter(function (x) { return x.fecha === p.x; })[0];
        det.push({ nombre: im.nombre + ' · ' + im.canal,
                   valor: im.pieza + ' a ' + fNum(hoy ? hoy.sedes : im.sedes) +
                     ' sedes' + (im.tramo > 1
                       ? ' (de ' + fNum(im.sedes) + ' en ' + im.tramo + ' días)' : '') });
      });
      var r = hh.getBoundingClientRect(), cr = svg.getBoundingClientRect();
      tt.mostrar(r.left - cr.left + r.width / 2, r.top - cr.top + 30,
        tooltipHTML(etiquetaX(p.x, 'dia'), det));
    });
    hh.addEventListener('mouseleave', function () { tt.ocultar(); });
  });
}

/* Frente 7 · Long tail. La cadencia de los workflows contra las solicitudes
   que produce la poblacion que tocan. */
function vistaF7() {
  var f = D.f7;

  var h = '<div class="frente-head">' +
    '<div class="eyebrow">Frente 7 · long tail</div>' +
    '<h1>Cuando tocamos la cola larga, ¿aplican más?</h1>' +
    '<p class="lead">Los workflows impactan por cadencia: una pieza, un delay, ' +
    'otra pieza. Acá se ve si eso mueve las solicitudes o solo gasta toques.</p>' +
    '</div>';
  h += cintaOrigen();

  // Filtro de cluster: acota TODO el frente (serie, impactos, workflows,
  // KPIs) a una sola audiencia. "sin filtrar" muestra las cinco a la vez,
  // que es como se ve hoy sin tocar nada.
  var clusters = f.clusters || [];
  if (clusters.length) {
    h += '<div class="cmp-barra">' +
      '<span class="cmp-tit">Cluster</span>' +
      '<button class="cmp-chip' + (!f.filtroActivo ? ' on' : '') +
      '" onclick="f7SetFiltro(\'\')">Todos</button>' +
      clusters.map(function (c) {
        return '<button class="cmp-chip' + (f.filtroActivo === c.clave ? ' on' : '') +
          '" onclick="f7SetFiltro(\'' + esc(c.clave) + '\')">' +
          esc(c.nombre) + ' <small>' + fNum(c.sedes) + '</small></button>';
      }).join('') +
      '</div>';
  }

  if (!f.hay) {
    h += '<div class="vacio-graf">No hay sedes de la cola larga en este universo' +
      (f.filtroActivo ? ' para este cluster' : '') + '. Prueba con otro origen' +
      (f.filtroActivo ? ' o quita el filtro de cluster' : '') + '.</div>';
    return h;
  }
  h += filaKPIs(f.kpis);

  // --- la grafica con los impactos ---
  var imp = f.impactos || [];
  // El id permite repintar solo los chips al apagar un impacto, sin rehacer
  // la vista entera: con render() completo la pagina saltaba al inicio.
  var chips = imp.length
    ? '<div class="imp-chips" id="f7Chips">' + chipsImpactos(f) + '</div>' : '';

  h += '<div style="margin-top:14px">' +
    panel('Solicitudes y desembolso por día, con los impactos que mandamos',
      'barras y eje izquierdo = solicitudes · línea verde y eje derecho = ' +

/* Si un frente nuevo no entra aca, irA() lo rebota a f1 y el boton del nav
   se ve muerto aunque la vista este bien escrita: paso con f8 el 28-sep-2026
   (el render y los datos estaban perfectos, el clic no llegaba). Agregar un
   frente son CUATRO puntos, no tres: nav en dashboard.html, vistaFX(),
   el dispatcher de render(), y esta lista. */
var VISTAS_VALIDAS = ['f1', 'f2', 'f4', 'f5', 'f6', 'f7', 'f8'];

function irA(v, sinHash) {
  if (VISTAS_VALIDAS.indexOf(v) < 0) v = 'f1';
  VISTA = v;
  document.querySelectorAll('.nav-item').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-vista') === v ? 'true' : 'false');
  });
  // El hash permite mandarle a alguien el link de un frente concreto.
  if (!sinHash) {
    try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; }
  }
  if (D) render();
}

function vistaDelHash() {
  var h = String(location.hash || '').replace('#', '');
  return VISTAS_VALIDAS.indexOf(h) >= 0 ? h : 'f1';
}

/* ------------------------------------------------------------- fechas */
function iso(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function lunes(d) {
  var x = new Date(d.getTime());
  var w = x.getDay();
  x.setDate(x.getDate() + (w === 0 ? -6 : 1 - w));
  return x;
}

/* ------------------------------------------------- rango de fechas */
/* Un solo rango libre (desde / hasta). Antes eran dos selectores, mes y
   semana-del-mes, para que el rango fuera siempre un periodo "redondo" del
   negocio — pero eso impedia mirar una ventana real como un evento de cinco
   dias a caballo entre dos meses. Con el rango libre el motor arma el
   comparativo "periodo anterior" con la misma cantidad de dias inmediatamente
   antes, asi que cualquier ventana tiene su contra-parte. */
function v0(d) { return d.toISOString().substring(0, 10); }

/* Un selector por ROL, cada uno con su gente. Tres controles porque son tres
   asignaciones que CONVIVEN: a una sede la trae un hunter, la cultiva un
   farmer y la retiene un CS.

   Se combinan con Y: elegir hunter=Johanna y farmer=Viviana da las sedes que
   trajo Johanna Y que hoy cultiva Viviana. Con O, agregar un filtro daria un
   universo MAS grande, que es lo contrario de lo que espera quien filtra. */
function montarSelectorOwner() {
  var cat = (D && D.meta && D.meta.catalogoRoles) || [];
  var cont = document.getElementById('filtrosOwner');
  if (!cont || !cat.length) return;
  cont.innerHTML = cat.map(function (c) {
    var id = 'selRol_' + c.id;
    var sel = ROLES_SEL[c.id] || '';
    return '<div class="campo"><label for="' + id + '">' + esc(c.nombre) +
      '</label><select id="' + id + '" data-rol="' + esc(c.id) + '">' +
      '<option value="">— sin filtrar —</option>' +
      (c.id === 'hunter' ? '<option value="__equipo__"' +
        (sel === '__equipo__' ? ' selected' : '') + '>Equipo completo (los ' +
        c.gente.length + ' hunters)</option>' : '') +
      c.gente.map(function (g) {
        return '<option value="' + esc(g.id) + '"' +
          (sel === g.id ? ' selected' : '') + '>' + esc(g.nombre) +
          ' (' + fNum(g.sedes) + ')</option>';
      }).join('') + '</select></div>';
  }).join('');
  cont.querySelectorAll('select').forEach(function (sl) {
    sl.addEventListener('change', function () {
      ROLES_SEL = {};
      cont.querySelectorAll('select').forEach(function (s2) {
        if (s2.value) ROLES_SEL[s2.getAttribute('data-rol')] = s2.value;
      });
      cargar();
    });
  });
}

/* El rango de un mes, recortado a hoy si el mes no ha terminado. Ya no hay
   selector de mes, pero sigue haciendo falta para el arranque: el tablero
   abre en el mes en curso. */
function rangoDeMes(m) {
  var y = Number(m.substring(0, 4)), i = Number(m.substring(5, 7)) - 1;
  var b = v0(new Date(Date.UTC(y, i + 1, 0)));
  var hoy = iso(new Date());
  if (b > hoy) b = hoy;
  return { desde: m + '-01', hasta: b };
}

/** Deja los dos calendarios en el mes completo, sin recargar. */
function aplicarSeleccionMes(m) {
  var r = rangoDeMes(m);
  document.getElementById('fDesde').value = r.desde;
  document.getElementById('fHasta').value = r.hasta;
}

/* Con dos calendarios libres el usuario puede invertir el rango o dejar uno
   vacio. En vez de recargar con un rango imposible (que el motor leeria como
   un periodo de cero dias y pintaria todo en blanco), se corrige aca y se
   avisa en la cinta de estado. */
function aplicarSeleccion(recargar) {
  var ia = document.getElementById('fDesde');
  var ib = document.getElementById('fHasta');
  var a = ia.value, b = ib.value;
  if (!a && !b) return;
  if (!a) a = b;
  if (!b) b = a;
  if (a > b) { var t = a; a = b; b = t; }   // invertido: se endereza
  ia.value = a;
  ib.value = b;
  if (recargar !== false) cargar();
}

/* -------------------------------------------------------------- carga */
function cargar() {
  if (CARGANDO) return;
  CARGANDO = true;
  var ini = document.getElementById('fDesde').value;
  var fin = document.getElementById('fHasta').value;
  var orig = ORIGENES_SEL.slice();
  document.getElementById('vistas').classList.add('oculto');
  document.getElementById('error').classList.add('oculto');
  document.getElementById('cargando').classList.remove('oculto');

  function ok(datos) {
    CARGANDO = false;
    D = datos;
    // El catalogo llega siempre completo, sin importar el filtro activo.
    if (D.meta) {
      CATALOGO_ORIG = D.meta.catalogoOrigenes || CATALOGO_ORIG;
      PRESETS_ORIG = D.meta.presetsOrigen || PRESETS_ORIG;
      ETIQ_PRESET = D.meta.etiquetasPreset || ETIQ_PRESET;
      if (D.meta.origenes) ORIGENES_SEL = D.meta.origenes.slice();
      // ROLES_SEL lo manda el frontend y el motor lo devuelve tal cual en
      // meta.roles, asi que se puede sincronizar sin perder nada.
      if (D.meta.roles) ROLES_SEL = D.meta.roles;
      montarSelectorOwner();
      // Los dos calendarios se dejan en el rango que el motor confirma que
      // uso, no en el que el usuario tecleo: si el motor lo recorto (por
      // ejemplo el fin a hoy), los inputs tienen que decir la verdad.
      if (D.meta.inicio) document.getElementById('fDesde').value = D.meta.inicio;
      if (D.meta.fin) document.getElementById('fHasta').value = D.meta.fin;
    }
    pintarPanelOrigen();
    render();
  }
  function mal(err) {
    CARGANDO = false;
    document.getElementById('cargando').classList.add('oculto');
    var e = document.getElementById('error');
    e.innerHTML = '<b>No se pudo leer el Sheet.</b><br>' + esc(err && err.message ? err.message : err) +
      '<br><br>Revisa que SHEET_ID en Config.gs sea correcto y que el dueño del script tenga ' +
      'acceso al Google Sheet.';
    e.classList.remove('oculto');
  }

  // Vista previa: corre el MISMO getDashboardData() del servidor sobre las
  // tablas embebidas, con shims de las APIs de Google. Antes traia payloads
  // pre-calculados por rango de fecha, y como el tablero solo tiene
  // calendario (sin atajos), cualquier fecha elegida a mano no existia en el
  // diccionario, caia al payload de respaldo y el filtro de origen parecia
  // no hacer nada. Ahora cualquier combinacion se calcula en vivo.
  if (window.MOTOR_LOCAL) {
    setTimeout(function () {
      try {
        ok(getDashboardData(ini, fin, orig, ROLES_SEL, CMP_F2, F7_FILTRO_AUD));
      } catch (e) {
        mal(e);
      }
    }, 20);
    return;
  }
  if (window.DATOS_PRECARGADOS) {
    setTimeout(function () { ok(window.DATOS_PRECARGADOS); }, 60);
    return;
  }
  google.script.run.withSuccessHandler(ok).withFailureHandler(mal)
    .getDashboardData(ini, fin, orig, ROLES_SEL, CMP_F2, F7_FILTRO_AUD);
}

/* --------------------------------------------------------------- tema */
function aplicarTema(t) {
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem('welli-tema', t); } catch (e) {}
  if (D) render();     // las gráficas leen los colores por variable CSS
}

/* --------------------------------------------------------------- init */
document.addEventListener('DOMContentLoaded', function () {
  // Prioridad del tema: lo que el usuario eligió aquí > el tema que el
  // contenedor ya impuso (data-theme, cuando el tablero va embebido) >
  // la preferencia del sistema.
  var raiz = document.documentElement;
  var host = raiz.getAttribute('data-theme');
  var t = (host === 'dark') ? 'oscuro' : (host === 'light' ? 'claro' : null);
  try {
    t = localStorage.getItem('welli-tema') || t;
  } catch (e) {}
  if (!t) {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'oscuro' : 'claro';
  }
  raiz.setAttribute('data-tema', t);

  document.getElementById('btnTema').addEventListener('click', function () {
    aplicarTema(document.documentElement.getAttribute('data-tema') === 'oscuro'
      ? 'claro' : 'oscuro');
  });
  montarFiltroOrigen();
  document.getElementById('btnAplicar').addEventListener('click', function () {
    aplicarSeleccion(true);
  });
  // Los dos calendarios recargan solos al cambiar: con un rango libre, tener
  // que darle además a "Aplicar" es un paso de más (el boton se queda para
  // reintentar sin tocar las fechas).
  ['fDesde', 'fHasta'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      aplicarSeleccion(true);
    });
  });
  document.querySelectorAll('.nav-item').forEach(function (b) {
    b.addEventListener('click', function () { irA(b.getAttribute('data-vista')); });
  });

  irA(vistaDelHash(), true);
  window.addEventListener('hashchange', function () { irA(vistaDelHash(), true); });

  // Arranca en el mes en curso. Si lleva menos de una semana se abre el
  // anterior: un mes de dos dias se lee como una caida y no es lo primero
  // que alguien deberia ver. De ahi en adelante el rango es libre.
  var hoy0 = new Date();
  var diaHoy = Number(iso(hoy0).substring(8, 10));
  var mesArranque = iso(hoy0).substring(0, 7);
  if (diaHoy < 7) {
    var yy = hoy0.getFullYear(), mm = hoy0.getMonth() - 1;
    mesArranque = iso(new Date(yy, mm, 1)).substring(0, 7);
  }
  aplicarSeleccionMes(mesArranque);
  cargar();
});
</script>
